<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#1a1528" />
      <stop offset="70%" stopColor="#0d0a14" />
      <stop offset="100%" stopColor="#050408" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="40%" stopColor="#eab308" />
      <stop offset="80%" stopColor="#ca8a04" />
      <stop offset="100%" stopColor="#854d0e" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#7f1d1d" />
      <stop offset="40%" stopColor="#dc2626" />
      <stop offset="75%" stopColor="#f97316" />
      <stop offset="100%" stopColor="#fef08a" />
    </linearGradient>
    <radialGradient id="spellGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="1" />
      <stop offset="50%" stopColor="#0284c7" stopOpacity="0.6" />
      <stop offset="100%" stopColor="#0369a1" stopOpacity="0" />
    </radialGradient>
    <filter id="goldDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#eab308" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Filigree Shield Rim -->
  <path
    d="M256,40 C350,40 430,75 430,170 C430,310 330,420 256,470 C182,420 82,310 82,170 C82,75 162,40 256,40 Z"
    fill="#120e1c"
    stroke="url(#goldGrad)"
    stroke-width="10"
    filter="url(#goldDrop)"
  />

  <!-- Inner Ornate Shield Border -->
  <path
    d="M256,62 C334,62 406,92 406,172 C406,294 318,394 256,440 C194,394 106,294 106,172 C106,92 178,62 256,62 Z"
    fill="none"
    stroke="#d4af37"
    stroke-width="2.5"
    stroke-dasharray="8 6"
    opacity="0.75"
  />

  <!-- Fiendfyre Flames at the base -->
  <path
    d="M170,390 C190,320 215,360 235,310 C250,270 260,330 280,290 C300,345 325,315 342,390 C310,410 280,430 256,440 C232,430 202,410 170,390 Z"
    fill="url(#flameGrad)"
    opacity="0.9"
  />

  <!-- Central Hogwarts Defense Castle Tower / Portcullis -->
  <path
    d="M220,290 L220,180 L236,180 L236,160 L248,160 L248,180 L264,180 L264,160 L276,160 L276,180 L292,180 L292,290 Z"
    fill="#1e182e"
    stroke="url(#goldGrad)"
    stroke-width="5"
  />

  <!-- Arched Gate Portcullis -->
  <path
    d="M236,290 L236,236 C236,225 245,216 256,216 C267,216 276,225 276,236 L276,290 Z"
    fill="#0a0710"
    stroke="url(#goldGrad)"
    stroke-width="4"
  />

  <!-- Glowing Cybersecurity Key / Ancient Ward Shield Motif -->
  <circle cx="256" cy="130" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="8" />
  <circle cx="256" cy="130" r="16" fill="url(#spellGlow)" />
  <polygon points="256,108 262,124 278,124 265,134 270,150 256,140 242,150 247,134 234,124 250,124" fill="#fef08a" />

  <!-- Diagonal Crossing Elder Wand -->
  <line x1="140" y1="360" x2="370" y2="130" stroke="#ca8a04" stroke-width="12" stroke-linecap="round" />
  <line x1="140" y1="360" x2="370" y2="130" stroke="#fef08a" stroke-width="4" stroke-linecap="round" />
  <!-- Wand Nodes (Elder Wand characteristic rings) -->
  <circle cx="200" cy="300" r="8" fill="#eab308" />
  <circle cx="255" cy="245" r="9" fill="#eab308" />
  <circle cx="310" cy="190" r="8" fill="#eab308" />
  <!-- Wand Tip Lumos Starburst -->
  <circle cx="376" cy="124" r="28" fill="url(#spellGlow)" />
  <circle cx="376" cy="124" r="9" fill="#ffffff" />
  <circle cx="376" cy="124" r="4" fill="#38bdf8" />

  <!-- Ancient Runes along bottom arch -->
  <text x="145" y="240" font-family="serif" font-size="22" font-weight="bold" fill="#d4af37" opacity="0.8">ᛏ</text>
  <text x="175" y="290" font-family="serif" font-size="22" font-weight="bold" fill="#d4af37" opacity="0.8">ᚨ</text>
  <text x="360" y="240" font-family="serif" font-size="22" font-weight="bold" fill="#d4af37" opacity="0.8">ᛋ</text>
  <text x="330" y="290" font-family="serif" font-size="22" font-weight="bold" fill="#d4af37" opacity="0.8">ᛗ</text>
</svg>
